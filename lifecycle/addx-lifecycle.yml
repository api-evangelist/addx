summary: >-
  ADDX path-versions its API (client/v1 and trading/api/v2) and carries exactly one in-document deprecation
  notice, at field level. It publishes no versioning policy, no deprecation policy, no Sunset/Deprecation
  header contract, no SLA and no status page that could be found from any ADDX host.
