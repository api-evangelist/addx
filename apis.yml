apis:
- name: ADDX Open API
  description: >-
    Publicly documented REST API that connects an external system to the ADDX platform. Roughly 68 operations
    across five documented groups — Account Management (account, balance, EAM investor, portfolio, transaction
    and wallet detail, plus STO subscription, subsequent-subscription and redemption flows for both self and
    EAM-managed investors), Market Data (aggregated order book, market depth, market state, token list, ticker
    feed, trade feed, account balances on the trading engine), Reporting (report types, report listing,
    downloads), Fiat Flow (bank-account management, document upload, fiat deposit and withdrawal with OTP
    confirmation, wealth-manager distribute/collect) and Digital Assets (balances, deposit addresses, withdrawal
    fees, email and mobile OTP, identity verification, withdrawal confirmation). Requests are signed with an
    HMAC-SHA256 X-Signature over the timestamp and HTTP method using a Key ID and secret passphrase the user
    generates in the platform's API Settings. The base URL is deliberately not published — ADDX issues it per
    environment and per use case on request — so the documented paths are relative to a host only a provisioned
    partner holds.
  humanURL: https://api-docs.addx.co/open-api/
