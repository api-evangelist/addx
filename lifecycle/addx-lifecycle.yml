  deprecated_items:
  - kind: field
    item: avg_price
    operation: Token Feed
    path: /openapi/trading/api/v2/public/markets/:token/tickers
    notice: 'Note: "avg_price" field in the response is deprecated and will be removed in next release.'
    removal_date: null
