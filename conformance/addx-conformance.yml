name: ADDX conformance and compliance
summary: >-
  ADDX's compliance posture is regulatory and organisational rather than protocol-level. It is licensed by
  the Monetary Authority of Singapore and publishes an ISO/IEC 27001:2013 certificate plus a full set of
  exchange rulebooks. Its API, by contrast, conforms to none of the cross-cutting web-API standards this
  catalog checks — no OAuth 2.0, no OpenID Connect, no RFC 9457 problem details, no RFC 8594 deprecation
  signalling, no OpenAPI description — and it declares no domain standard for capital markets.
