  ADDX Open API reference, so that the shape of a future server is recorded; it is not an agent surface
  and nothing here can be called today. Input schemas are left null deliberately: the reference documents
  request bodies as prose and JSON examples rather than as a schema, and ADDX does not publish an OpenAPI
  document to derive parameters from, so inventing them would be fabrication.'
