sla:
  published: false
  uptime_target: null
  note: >-
    No SLA, uptime commitment or maintenance-window policy is published on the developer surface. The
    governing documents ADDX does publish are regulatory rulebooks (Platform Rules, Exchange Rules, Trading
    Rules, Listing Rules, OTC Rules, Best Execution Policy), not service-level commitments to API callers.
changelog:
  published: false
  url: null
  note: >-
    The Open API Library page carries no dated changelog, no version history and no last-updated stamp. The
    only temporal signal in the whole document is the "next release" wording on the avg_price deprecation.
environments:
  published: false
  note: >-
    "Base URL is dependent on the environment" — ADDX confirms multiple environments exist but names none of
    them and issues the applicable base URL on request per use case.
gaps:
- No versioning or deprecation policy, so a partner has no stated notice period before a breaking change.
- The one deprecation that is published has no removal date, only "next release".
- No status page and no incident history for a licensed exchange whose API moves client money.
- No changelog, so a partner cannot tell whether the reference has changed since they integrated.
