aid: addx
name: ADDX
description: >-
  ADDX is a Singapore-headquartered digital securities exchange and private-markets investment platform,
  licensed by the Monetary Authority of Singapore for the issuance, custody and secondary trading of digital
  securities. Founded in 2017 as iSTOX, it tokenises and fractionalises private equity, private credit, hedge
  funds, structured products, fixed income and commercial paper so accredited investors can subscribe at
  roughly USD 10,000 rather than institutional minimums. Alongside the consumer web and mobile app, ADDX
  Advantage packages the same rails for wealth managers, brokers and external asset managers (EAMs), and the
  publicly documented ADDX Open API — an HMAC-signed REST surface of about 68 operations covering account and
  investor information, STO subscription and redemption, wallet, fiat and digital-asset flows, exchange
  order-book market data and investor reporting — lets those partners drive the platform from their own systems.
