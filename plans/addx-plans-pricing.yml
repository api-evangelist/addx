name: ADDX plans and pricing
plan_count: 0
plans: []
summary: >-
  ADDX publishes no plans, tiers or subscription pricing, and none for API access in particular. It is a
  regulated exchange, not a metered SaaS: there is no signup fee and no account fee, and revenue comes from
  transaction fees on investments and on secondary trading. The ADDX Open API is not sold as a product with
  a price — it is an access channel offered to onboarded partners (ADDX Advantage wealth managers, brokers
  and external asset managers), and the ADDX Advantage page states only "Choose between accessing directly
  through web portal, or API integration with your existing system" with no commercial terms attached.
